<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
        </style>
        <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.04" />
        </filter>
    </defs>
    
    <!-- Canvas Background -->
    <rect width="1200" height="480" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header Banner -->
    <g transform="translate(45, 40)">
        <circle cx="10" cy="14" r="5" fill="#4F46E5" />
        <text x="24" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#111827">AI 时代校招生求职与实战能力重构架构</text>
        <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#6B7280">四象限岗位认知定位、Prompt 审美跃迁与 48 小时可测试 Demo 闭环</text>
    </g>
    
    <!-- Flow Cards -->
    
        <!-- Step 1 Card -->
        <g transform="translate(45, 130)">
            <!-- Drop Shadow -->
            <rect x="0" y="4" width="250" height="290" rx="12" fill="rgba(0,0,0,0.03)" />
            <!-- Card Body -->
            <rect x="0" y="0" width="250" height="290" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
            <!-- Top Color Accent Bar -->
            <path d="M0 12 Q0 0 12 0 L238 0 Q250 0 250 12 L250 6 L0 6 Z" fill="#4F46E5" />
            
            <!-- Step Header Pill -->
            <rect x="18" y="24" width="70" height="22" rx="6" fill="#4F46E515" />
            <text x="26" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#4F46E5">STEP 01</text>
            
            <!-- Titles -->
            <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#111827">01. 岗位四象限定位</text>
            <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#6B7280">Role Taxonomy</text>
            
            <!-- Divider -->
            <line x1="18" y1="112" x2="232" y2="112" stroke="#F3F4F6" stroke-width="1.5" />
            
            <!-- Description -->
            <foreignObject x="18" y="124" width="214" height="140">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.6; color: #4B5563;">
                    区分底层算力、微调优化、智能体系统与赋能应用，阻击盲目调包内卷
                </div>
            </foreignObject>
        </g>
        
            <g transform="translate(305, 263)">
                <circle cx="8" cy="12" r="14" fill="#F3F4F6"/>
                <path d="M5 8 L11 12 L5 16" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            
        
        <!-- Step 2 Card -->
        <g transform="translate(331, 130)">
            <!-- Drop Shadow -->
            <rect x="0" y="4" width="250" height="290" rx="12" fill="rgba(0,0,0,0.03)" />
            <!-- Card Body -->
            <rect x="0" y="0" width="250" height="290" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
            <!-- Top Color Accent Bar -->
            <path d="M0 12 Q0 0 12 0 L238 0 Q250 0 250 12 L250 6 L0 6 Z" fill="#7C3AED" />
            
            <!-- Step Header Pill -->
            <rect x="18" y="24" width="70" height="22" rx="6" fill="#7C3AED15" />
            <text x="26" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#7C3AED">STEP 02</text>
            
            <!-- Titles -->
            <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#111827">02. Prompt 审美跃迁</text>
            <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#6B7280">Prompt Taste</text>
            
            <!-- Divider -->
            <line x1="18" y1="112" x2="232" y2="112" stroke="#F3F4F6" stroke-width="1.5" />
            
            <!-- Description -->
            <foreignObject x="18" y="124" width="214" height="140">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.6; color: #4B5563;">
                    从学生式模糊提问跃迁至生产级上下文注入、负向硬约束与严格 Schema 校验
                </div>
            </foreignObject>
        </g>
        
            <g transform="translate(591, 263)">
                <circle cx="8" cy="12" r="14" fill="#F3F4F6"/>
                <path d="M5 8 L11 12 L5 16" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            
        
        <!-- Step 3 Card -->
        <g transform="translate(617, 130)">
            <!-- Drop Shadow -->
            <rect x="0" y="4" width="250" height="290" rx="12" fill="rgba(0,0,0,0.03)" />
            <!-- Card Body -->
            <rect x="0" y="0" width="250" height="290" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
            <!-- Top Color Accent Bar -->
            <path d="M0 12 Q0 0 12 0 L238 0 Q250 0 250 12 L250 6 L0 6 Z" fill="#10B981" />
            
            <!-- Step Header Pill -->
            <rect x="18" y="24" width="70" height="22" rx="6" fill="#10B98115" />
            <text x="26" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#10B981">STEP 03</text>
            
            <!-- Titles -->
            <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#111827">03. 48h Demo 极速交付</text>
            <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#6B7280">Interactive Prototype</text>
            
            <!-- Divider -->
            <line x1="18" y1="112" x2="232" y2="112" stroke="#F3F4F6" stroke-width="1.5" />
            
            <!-- Description -->
            <foreignObject x="18" y="124" width="214" height="140">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.6; color: #4B5563;">
                    使用 Streamlit/Gradio 极速交付具备可测试性、异常处理与手机扫码测验的端到端原型
                </div>
            </foreignObject>
        </g>
        
            <g transform="translate(877, 263)">
                <circle cx="8" cy="12" r="14" fill="#F3F4F6"/>
                <path d="M5 8 L11 12 L5 16" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            
        
        <!-- Step 4 Card -->
        <g transform="translate(903, 130)">
            <!-- Drop Shadow -->
            <rect x="0" y="4" width="250" height="290" rx="12" fill="rgba(0,0,0,0.03)" />
            <!-- Card Body -->
            <rect x="0" y="0" width="250" height="290" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
            <!-- Top Color Accent Bar -->
            <path d="M0 12 Q0 0 12 0 L238 0 Q250 0 250 12 L250 6 L0 6 Z" fill="#059669" />
            
            <!-- Step Header Pill -->
            <rect x="18" y="24" width="70" height="22" rx="6" fill="#05966915" />
            <text x="26" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#059669">STEP 04</text>
            
            <!-- Titles -->
            <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#111827">04. 技术深度探针</text>
            <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#6B7280">Technical Depth Probe</text>
            
            <!-- Divider -->
            <line x1="18" y1="112" x2="232" y2="112" stroke="#F3F4F6" stroke-width="1.5" />
            
            <!-- Description -->
            <foreignObject x="18" y="124" width="214" height="140">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.6; color: #4B5563;">
                    因果逻辑推演面试防守：显存换算、延迟权衡、鲁棒性兜底与真实业务指标
                </div>
            </foreignObject>
        </g>
        
        
</svg>