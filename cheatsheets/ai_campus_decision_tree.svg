<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background:#090A0F;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A"/>
      <stop offset="100%" stop-color="#181922"/>
    </linearGradient>
  </defs>
  
  <!-- Header -->
  <text x="600" y="45" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="1">AI-ERA CAMPUS HIRING DECISION TREE // ECOSYSTEM CLASSIFIER</text>
  <text x="600" y="75" text-anchor="middle" fill="#10B981" font-size="13" font-family="monospace" letter-spacing="2">ROOT DIAGNOSTIC: WHERE DOES YOUR REPOSITORY FIT?</text>

  <!-- Root Node -->
  <rect x="425" y="110" width="350" height="60" rx="8" fill="url(#boxGrad)" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="138" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">What is the core artifact of your project?</text>
  <text x="600" y="156" text-anchor="middle" fill="#A1A1AA" font-size="11">Select primary value proposition</text>

  <!-- Branch 1: Infra -->
  <line x1="450" y1="170" x2="160" y2="240" stroke="#34D399" stroke-width="1.5"/>
  <rect x="30" y="240" width="260" height="150" rx="8" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="160" y="270" text-anchor="middle" fill="#34D399" font-size="12" font-family="monospace" font-weight="700">01 // COMPUTE INFRA</text>
  <text x="160" y="295" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Throughput & VRAM Math</text>
  <text x="50" y="325" fill="#A1A1AA" font-size="11.5">• Kernel tuning (CUDA/Triton)</text>
  <text x="50" y="345" fill="#A1A1AA" font-size="11.5">• KV Cache allocation math</text>
  <text x="50" y="365" fill="#A1A1AA" font-size="11.5">• Distributed inference latency</text>

  <!-- Branch 2: Tuning -->
  <line x1="550" y1="170" x2="440" y2="240" stroke="#34D399" stroke-width="1.5"/>
  <rect x="310" y="240" width="260" height="150" rx="8" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="440" y="270" text-anchor="middle" fill="#34D399" font-size="12" font-family="monospace" font-weight="700">02 // DOMAIN TUNING</text>
  <text x="440" y="295" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Corpus & Parameter SFT</text>
  <text x="330" y="325" fill="#A1A1AA" font-size="11.5">• LoRA / QLoRA rank selection</text>
  <text x="330" y="345" fill="#A1A1AA" font-size="11.5">• SFT dataset curation pipeline</text>
  <text x="330" y="365" fill="#A1A1AA" font-size="11.5">• DPO preference alignment</text>

  <!-- Branch 3: Agents -->
  <line x1="650" y1="170" x2="760" y2="240" stroke="#34D399" stroke-width="1.5"/>
  <rect x="630" y="240" width="260" height="150" rx="8" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="760" y="270" text-anchor="middle" fill="#34D399" font-size="12" font-family="monospace" font-weight="700">03 // AGENT ORCHESTRATION</text>
  <text x="760" y="295" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">ReAct & Resilient Tool Use</text>
  <text x="650" y="325" fill="#A1A1AA" font-size="11.5">• Multi-agent coordination loops</text>
  <text x="650" y="345" fill="#A1A1AA" font-size="11.5">• State machine & deadlock guards</text>
  <text x="650" y="365" fill="#A1A1AA" font-size="11.5">• Context pruning & retry limits</text>

  <!-- Branch 4: Apps & Demos -->
  <line x1="750" y1="170" x2="1040" y2="240" stroke="#34D399" stroke-width="1.5"/>
  <rect x="910" y="240" width="260" height="150" rx="8" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="1040" y="270" text-anchor="middle" fill="#34D399" font-size="12" font-family="monospace" font-weight="700">04 // 48H LIVE DEMO</text>
  <text x="1040" y="295" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Mobile-Accessible Prototype</text>
  <text x="930" y="325" fill="#A1A1AA" font-size="11.5">• Streamlit / Gradio live host</text>
  <text x="930" y="345" fill="#A1A1AA" font-size="11.5">• Mobile QR code testable demo</text>
  <text x="930" y="365" fill="#A1A1AA" font-size="11.5">• Fact verification anti-hallucination</text>

  <!-- Bottom Evaluation Banner -->
  <rect x="30" y="440" width="1140" height="95" rx="8" fill="rgba(16,185,129,0.06)" stroke="#10B981" stroke-width="1"/>
  <text x="600" y="475" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">BIGTECH HIRING COMMITTEE RULE OF THUMB</text>
  <text x="600" y="502" text-anchor="middle" fill="#A1A1AA" font-size="12">If an interviewer challenges your project, you must defend the causal trade-offs (Latency vs. Throughput, Cost vs. Accuracy) in under 60 seconds.</text>
</svg>
